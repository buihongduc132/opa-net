name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      # Belt-and-suspenders: use the OPA setup-opa installed on PATH instead
      # of the mise-path resolver. The runner has ~/.local/share/mise/installs/opa
      # present but with no semver opa install, which previously produced a
      # non-existent candidate path -> ENOENT -> fail-open in 0ms.
      PI_OPA_BINARY: opa
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: "1.3.0"
          # static: true avoids 404s on runners where the non-static darwin
          # release asset for the pinned version is missing.
          static: true
      - name: OPA version (diagnostic)
        run: opa version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint:ci
      - run: bun run test:coverage
      - run: bun run smoke

  package-dry-run:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: npm pack dry-run
        run: |
          # Use npm to verify the published tarball contents
          npm pack --dry-run 2>&1 | tee pack.log
          # Assert no source maps, node_modules, or .git leak into the tarball
          ! grep -E 'node_modules/|\.git/|\.map$' pack.log

  publish:
    needs: package-dry-run
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Check version bump
        run: |
          CURRENT=$(npm view pi-opa-net version 2>/dev/null || echo "0.0.0")
          LOCAL=$(node -p "require('./package.json').version")
          echo "npm current=$CURRENT local=$LOCAL"
          [ "$CURRENT" != "$LOCAL" ]
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
